# Reproduction recipe: GPT-2 124M trilingual retrain-to-recover: SRSPD vs SimNPO, RMU, KUDA (sweep settings and equal-budget variants)
# Generated from the published run configs and result tables; doses are
# mu_per_token (legacy doses are converted at load, recipes.legacy).
result: gpt2_trilingual_recovery
title: 'GPT-2 124M trilingual retrain-to-recover: SRSPD vs SimNPO, RMU, KUDA (sweep settings and equal-budget
  variants)'
description: Each edited checkpoint is retrained on the pretraining mixture until its Dutch validation
  CE is back at the unedited model's (tolerance 0 and 1%); the measured quantity is the token count M
  (rspd.experiments.eval.recovery). Equal-budget runs see the target 200 times and every retained token
  once.
model: thate10/rspd-gpt2-124m-trilingual-base
base_checkpoint: models/recipes/gpt2_trilingual_base
tensor_parallel_size: 1
hardware:
  method: 1x 48 GB GPU (L40S)
  eval: 1x 80 GB GPU (H100), retraining
data_prep:
- download:
    repo: thate10/rspd-gpt2-124m-trilingual-base
    local_dir: models/recipes/gpt2_trilingual_base
  note: the trilingual base checkpoint (private repo; needs HF_TOKEN)
- call: rspd.experiments.data.gpt2_corpus:prepare
  spec: gpt2_trilingual_corpus
  note: the pretraining corpus and BPE (the recovery stream and tokenizer)
- call: rspd.experiments.data.gpt2_unlearning:prepare_unlearning_sets
  spec: gpt2_unlearning_1m
  note: the unlearning sets; time-dependent rebuild (live Wikipedia API) unless a published copy is passed
    to gpt2_unlearning.ensure_unlearning_sets
eval:
  kind: recovery
  config:
    corpus_name: gpt2_corpus
    recovery:
      ce_nld_original: 3.5437
      tolerance: 0.0
      stream: train
      stream_languages:
      - eng
      - deu
      - nld
      stream_seed: 2026
      cap_tokens: 1000000000
      eval_every_tokens: 25000000
      eval_batches: 40
      batch_tokens: 491520
      micro_batch: 16
      block_size: 1024
      lr: 0.0001
      min_lr_frac: 0.1
      warmup_tokens: 5000000
      weight_decay: 0.1
      grad_clip: 1.0
      seed: 1337
      compile: true
      dtype: bfloat16
      monitors:
        unlearning_sets: gpt2_unlearning_1m
        train_sample_tokens: 200000
      weight_delta:
        erank: true
baseline:
  id: base
  label: Unmodified
  eval_overrides:
    condition: base
  published:
  - task: recovery/base
    metric: M_tokens_tol1pct
    value: 0.0
    rel_tol: 0.5
    note: stochastic retraining at 25M-token evaluation granularity
  - task: recovery/base
    metric: M_tokens_tol0
    value: 0.0
    rel_tol: 0.5
    note: stochastic retraining at 25M-token evaluation granularity
runs:
- id: simnpo_lr1e4_b01
  method: simnpo
  label: SimNPO, lr 1e-4, β 0.1
  config:
    name: gpt2_trilingual_simnpo_lr1e4_b01
    model: models/recipes/gpt2_trilingual_base
    dtype: float32
    device_map: cuda
    seed: 42
    corpora:
      target_nld:
        kind: local_jsonl
        path: datasets/gpt2_unlearning/gpt2_unlearning_1m/target_nld.jsonl
        text_field: text
        topic: target
      contrastive:
        kind: local_jsonl
        path:
        - datasets/gpt2_unlearning/gpt2_unlearning_1m/contrastive_eng.jsonl
        - datasets/gpt2_unlearning/gpt2_unlearning_1m/contrastive_deu.jsonl
        text_field: text
        topic: retain
      heldout_nld:
        kind: local_jsonl
        path: datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_nld.jsonl
        text_field: text
        topic: heldout
      heldout_eng:
        kind: local_jsonl
        path: datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_eng.jsonl
        text_field: text
        topic: heldout
      heldout_deu:
        kind: local_jsonl
        path: datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_deu.jsonl
        text_field: text
        topic: heldout
    heldout:
      rows: 32
      max_length: 1024
      tail:
      - heldout_eng
      - heldout_deu
    simnpo:
      beta: 0.1
      gamma: 0.0
      forget_weight: 1.0
      retain_weight: 1.0
      forget_corpora:
      - target_nld
      retain_corpus: contrastive
      min_len: 0
      forget_max_length: 1024
      retain_max_length: 1024
      max_rows: 4000
    train:
      optim: adamw_torch
      lr: 0.0001
      max_steps: 200
      num_epochs: 1000
      batch_size: 2
      grad_accum: 2
      weight_decay: 0.0
      max_grad_norm: 1.0
      warmup_steps: null
      bf16: false
      gradient_checkpointing: false
      log_every: 10
  exports:
  - id: simnpo_lr1e4_b01
    eval_overrides:
      condition: simnpo_lr1e4_b01
    weights:
      repo: thate10/rspd-gpt2-124m-trilingual-unlearned
      subfolder: simnpo_lr1e4_b01
      private: true
    published:
    - task: recovery/simnpo_lr1e4_b01
      metric: M_tokens_tol1pct
      value: 25067520.0
      rel_tol: 0.5
      note: stochastic retraining at 25M-token evaluation granularity
    - task: recovery/simnpo_lr1e4_b01
      metric: M_tokens_tol0
      value: 225607680.0
      rel_tol: 0.5
      note: stochastic retraining at 25M-token evaluation granularity
