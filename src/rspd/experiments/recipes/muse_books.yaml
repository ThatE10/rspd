# Reproduction recipe: MUSE-Books: SRSPD sweeps vs KUDA and SimNPO (ports and authors' code)
# Generated from the published run configs and result tables; doses are
# mu_per_token (legacy doses are converted at load, recipes.legacy).
result: muse_books
title: 'MUSE-Books: SRSPD sweeps vs KUDA and SimNPO (ports and authors'' code)'
description: VerbMem-f / KnowMem-f / PrivLeak / KnowMem-r by the package's re-implementation of the official
  evaluator (rspd.experiments.eval.muse), fp32, greedy, one prompt at a time; the retrained model is
  the PrivLeak reference.
model: muse-bench/MUSE-books_target
tensor_parallel_size: 1
hardware:
  method: 1x 80 GB GPU (H100), 8 CPU / 128 GiB host RAM for the fp32 SRSPD solves
  eval: 1x 48 GB GPU (L40S)
eval:
  kind: muse
  config:
    corpus: books
    tokenizer: meta-llama/Llama-2-7b-hf
    dtype: float32
    device_map: auto
    metrics:
    - verbmem_f
    - privleak
    - knowmem_f
    - knowmem_r
    verbmem_max_new_tokens: 128
    knowmem_max_new_tokens: 32
    privleak_auc_key: forget_holdout_Min-40%
    reference: books_target
    limit: null
    batch_size: 1
