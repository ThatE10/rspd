# Reproduction recipe: MUSE-News: SRSPD sweeps vs KUDA and SimNPO (ports and authors' code)
# Generated from the published run configs and result tables; doses are
# mu_per_token (legacy doses are converted at load, recipes.legacy).
result: muse_news
title: 'MUSE-News: SRSPD sweeps vs KUDA and SimNPO (ports and authors'' code)'
description: VerbMem-f / KnowMem-f / PrivLeak / KnowMem-r by the package's re-implementation of the official
  evaluator (rspd.experiments.eval.muse), fp32, greedy, one prompt at a time; the retrained model is
  the PrivLeak reference.
model: muse-bench/MUSE-news_target
tensor_parallel_size: 1
hardware:
  method: 1x 80 GB GPU (H100), 8 CPU / 128 GiB host RAM for the fp32 SRSPD solves
  eval: 1x 48 GB GPU (L40S)
