# The GPT-2 unlearning sets, 1M-token retained build
# (rspd.experiments.data.gpt2_unlearning): a 1,000-token Dutch target, 500k English
# + 500k German contrastive (retained) text that starts with the target articles'
# counterparts, and 200k held-out tokens per language. Prerequisite: the trilingual
# tokenizer at datasets/gpt2_corpus/tokenizer (gpt2_trilingual_corpus.yaml).
# Rebuilding is time-dependent (the counterparts come from the live Wikipedia API);
# prefer the published sets (gpt2_unlearning.ensure_unlearning_sets).
name: gpt2_unlearning_1m
corpus_name: gpt2_corpus
seed: 20261022

sources:
  nld:
    dataset: wikimedia/wikipedia
    config: 20231101.nl
    split: train
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    text_field: text
    id_field: id
    title_field: title
    skip_docs: 0
    sample_rate: 0.02
  eng:
    dataset: wikimedia/wikipedia
    config: 20231101.en
    split: train
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    text_field: text
    id_field: id
    title_field: title
    skip_docs: 0
    sample_rate: 0.02
  deu:
    dataset: wikimedia/wikipedia
    config: 20231101.de
    split: train
    revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
    text_field: text
    id_field: id
    title_field: title
    skip_docs: 0
    sample_rate: 0.02

budgets:                          # trilingual-BPE tokens, exact
  target_nld: 1000
  contrastive_eng: 500000
  contrastive_deu: 500000
  heldout_eng: 200000
  heldout_deu: 200000
  heldout_nld: 200000

sanitize:
  min_paragraph_chars: 200
  min_doc_chars: 1000

counterparts:
  langs: {eng: en, deu: de}
  langlinks_endpoint: https://nl.wikipedia.org/w/api.php
  extracts_endpoint: "https://{lang}.wikipedia.org/w/api.php"
