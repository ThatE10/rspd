# Dutch-unlearning sets for a large instruct model (rspd.experiments.data.dutch_sets):
# the GPT-2 sets' Dutch target article cut to exactly 1,000 tokens of the model's
# tokenizer, and the retained set -- a 1M-token mix (English prose, German web,
# code, German Wikipedia) plus 150,000 tokens of UltraChat test_sft rendered
# through the model's chat template -- rendered to per-bucket JSONL for the
# gradient baselines, with a 10% probe subset. The tokenizer is a parameter of
# dutch_sets.prepare (or add `tokenizer: <hub id>` here). The retained_corpus
# block must stay identical to the SRSPD data spec's `retained:` block so both
# read the same documents.
name: prepare_dutch_sets_1k
out: datasets/dutch_unlearning
probe_fraction: 0.1

target:
  source: datasets/gpt2_unlearning/gpt2_unlearning_1m/target_nld.jsonl
  text_field: text
  tokens: 1000
  out_file: target_nld_1k.jsonl

# Held-out readouts: pointed at (path, sha256, rows, tokens in the manifest), not copied.
heldout:
  - datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_nld.jsonl
  - datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_eng.jsonl
  - datasets/gpt2_unlearning/gpt2_unlearning_1m/heldout_deu.jsonl

retained_corpus:
  seed: 20260812
  chunk_tokens: 1024
  add_bos: true
  chat_template: null      # raw text for the mix; the chat bucket is templated by its format
  buckets:
    - name: en_prose
      dataset: HuggingFaceFW/fineweb-edu
      config: sample-10BT
      split: train
      revision: 87f09149ef4734204d70ed1d046ddc9ca3f2b8f9
      text_field: text
      tokens: 200000
      min_chars: 512
    - name: de_web
      dataset: HuggingFaceFW/fineweb-2
      config: deu_Latn
      split: train
      revision: af9c13333eb981300149d5ca60a8e9d659b276b9
      text_field: text
      tokens: 400000
      min_chars: 512
    - name: code
      dataset: codeparrot/codeparrot-clean-valid
      config: default
      split: train
      revision: 4db92d2ec0c1b4c41eeb439cfae16854511d9dcd
      text_field: content
      tokens: 200000
      min_chars: 256
    - name: de_wiki
      dataset: wikimedia/wikipedia
      config: 20231101.de
      split: train
      revision: b04c8d1ceb2f5cd4588862100d08de323dccfbaa
      text_field: text
      tokens: 200000
      min_chars: 512
    - name: chat
      dataset: HuggingFaceH4/ultrachat_200k
      config: default
      split: test_sft
      revision: 8049631c405ae6576f93f445c6b8166f76f5505a
      text_field: messages
      format: chat_messages        # tok.apply_chat_template(messages, add_generation_prompt=False)
      tokens: 150000
      min_chars: 0
