name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got. Paste the full error.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Smallest example that shows it
      render: python
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Model
      description: Hub id or architecture, and the dtype it was loaded in.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `python -c "import rspd, torch, transformers; print(rspd.__version__, torch.__version__, transformers.__version__)"`, plus GPU if any.
    validations:
      required: true
